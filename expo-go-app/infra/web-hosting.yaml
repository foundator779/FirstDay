AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  FirstDay Go web app. One S3 bucket with website hosting (an http link, so the phone can reach the
  Bee brain on your Wi-Fi) and a CloudFront distribution in front of it (an https link). Pay per use only:
  no monthly fee, you pay for the few MB stored and for what is served.

Rules:
  OnlyThisAccount:
    Assertions:
      - Assert: !Equals [!Ref "AWS::AccountId", "237320501162"]
        AssertDescription: This stack may only be deployed in AWS account 237320501162.

Resources:
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub firstday-go-web-${AWS::AccountId}
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      # Website hosting needs public read of the app files (static HTML, no secrets). Public ACLs stay blocked.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublicReadOfAppFiles
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${WebBucket.Arn}/*"

  Cdn:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: FirstDay Go web app (https)
        PriceClass: PriceClass_100
        HttpVersion: http2and3
        DefaultRootObject: index.html
        Origins:
          - Id: s3website
            DomainName: !Select [2, !Split ["/", !GetAtt WebBucket.WebsiteURL]]
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
              HTTPPort: 80
        DefaultCacheBehavior:
          TargetOriginId: s3website
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          Compress: true
          # Managed "CachingDisabled": a new upload shows up at once, no invalidations needed.
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad

Outputs:
  HttpsUrl:
    Description: Secure link. Everything except linking to Bee on your Wi-Fi.
    Value: !Sub "https://${Cdn.DomainName}"
  HttpUrlForBee:
    Description: Plain http link. Use this one on your home Wi-Fi to connect the Bee brain.
    Value: !GetAtt WebBucket.WebsiteURL
  BucketName:
    Description: Upload index.html, icon.png and manifest.webmanifest here.
    Value: !Ref WebBucket
